# --------------------------------------------------------------------------------------------- BIENVENIDA (Onboarding)
# Preguntas nativas de Discord: el miembro elige y Discord le da los roles. No hace falta un bot en marcha para elegir.
[[pregunta]]
titulo = "¿Qué quieres que te avisemos?"
roles = "familias"
multiple = true
[[pregunta]]
titulo = "¿Qué marcas te interesan?"
roles = "marcas"
multiple = true
[[pregunta]]
titulo = "¿Dónde compras?"
roles = "regiones"
multiple = true
[[pregunta]]
titulo = "Tu talla de zapatilla (EU). Puedes elegir varias"
roles = "tallas_eu"
multiple = true
