# Estructura de MI servidor de Discord (v0.8). Nombres, guías y textos propios.
# La instala `INSTALAR_SERVIDOR.bat` (cookgroup servidor --aplicar) con el token de un bot tuyo.
# Se puede repetir: lo que ya existe (mismo nombre) no se duplica, y los canales y conversaciones que ya tienes no se tocan.
#
# audiencia (quién VE la categoría; v0.9):
#          "todos"        = también visitantes (presentación, planes, muestra, soporte)
#          "suscriptores" = solo con el rol «Suscriptor activo» (y el equipo)
#          "equipo"       = solo Propietario, Staff y Moderador
# acceso (quién ESCRIBE, dentro de quien ve):
#          "lectura"   = solo el bot y el equipo publican
#          "miembros"  = todos leen y escriben
#          "privado"   = solo staff (y el bot)
# fuente:  quién publica: "bot:<canal del pipeline>" | "staff" | "miembros"
# estado:  "construido" (el código existe y tiene pruebas) | "siguiente-lote" | "ampliacion" | "moderacion-humana"

[servidor]
nombre = "Drops Shoes Madrid (desarrollo)"
canal_pruebas = "pruebas-bot"          # único canal para la PRIMERA entrega real autorizada

# --------------------------------------------------------------------------------------------- ROLES
[roles]
# Roles de ACCESO (dan permisos). «Visitante» = cualquiera sin «Suscriptor activo» (es @everyone; no se asigna).
acceso = ["Propietario", "Staff", "Moderador", "Suscriptor activo"]
staff = ["Staff"]
# Roles de PREFERENCIA (no dan ningún permiso: solo personalizan menciones de quien ya tiene acceso)
familias = ["Sneakers", "Lanzamientos", "Raffles", "Rebajas", "Streetwear", "Pokémon-TCG", "LEGO", "Electrónica",
            "Tiendas Madrid", "Reventa"]
marcas = ["Nike", "Jordan", "adidas", "New Balance", "ASICS", "Salomon", "UGG", "Converse", "Vans", "Puma", "On",
          "Hoka", "Timberland", "Yeezy"]
regiones = ["Envío a España", "Recogida en Madrid", "UE", "Reino Unido", "EE. UU."]
# Tallas EU de la 35 a la 49 en medias tallas: se crean como roles «EU 44,5»…
tallas_eu = ["35", "35,5", "36", "36,5", "37", "37,5", "38", "38,5", "39", "39,5", "40", "40,5", "41", "41,5", "42",
             "42,5", "43", "43,5", "44", "44,5", "45", "45,5", "46", "46,5", "47", "47,5", "48", "48,5", "49"]

