# ---------------------------------------------------------------- CHOLLOS (RSS público, formato Pepper)
# Verificado 19-nov-2026: /rss/hot devuelve 30 entradas con tienda, precio y "temperatura".

[[monitor]]
name = "chollometro-hot"
type = "rss"
store = "Chollometro"
base_url = "https://www.chollometro.com/rss/hot"
currency = "EUR"
interval_seconds = 600
channel = "chollos"
allow_unknown_price = true
min_temperature = 100         # solo chollos con ≥100° de la comunidad (evita ruido)

[[monitor]]
name = "dealabs-hot"
type = "rss"
store = "Dealabs"
base_url = "https://www.dealabs.com/rss/hot"
currency = "EUR"
interval_seconds = 900
channel = "chollos"
allow_unknown_price = true
min_temperature = 150

# ---------------------------------------------------------------- PINGS POR PALABRA CLAVE
# Pon el ID real del rol (Discord: Modo desarrollador > clic derecho en el rol > Copiar ID).
# Mientras role_id sea de ceros no mencionará a nadie útil; sin DISCORD_WEBHOOK_PINGS ni DEFAULT no se envía.

[[ping_rule]]
name = "jordan-4-barata"
keywords = ["jordan", "4"]
exclude_keywords = ["gs", "td", "ps"]
max_price = 230
channel = "pings"
role_id = "000000000000000000"
event_types = ["restock", "new_product", "price_drop", "price_error"]

[[ping_rule]]
name = "price-errors"
keywords = ["*"]              # cualquier producto
channel = "pings"
role_id = "000000000000000000"
event_types = ["price_error"]
