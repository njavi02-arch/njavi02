# ---------------------------------------------------------------- PINGS PERSONALES (filtros)
# Cada regla re-publica en "pings" las alertas que cumplen TODO lo que indiques, mencionando un rol.
# Campos: keywords (todas; "*" = cualquiera), exclude_keywords, brands, sizes (EU), regions (eu/uk/us/au),
# stores, max_price (en la moneda de la tienda), event_types (ver README).

[[ping_rule]]
name = "raffles-europa"
keywords = ["*"]
regions = ["eu"]
channel = "pings"
role_id = "000000000000000000"
event_types = ["raffle_open", "raffle_closing", "raffle_link_changed"]

[[ping_rule]]
name = "mi-talla-eu43"
keywords = ["*"]
sizes = ["43", "42.5"]
brands = ["Nike", "Jordan", "adidas", "New Balance", "ASICS"]
max_price = 250
channel = "pings"
role_id = "000000000000000000"
event_types = ["size_restock", "live", "restock", "new_size"]

# Pon el ID real del rol (Discord: Modo desarrollador > clic derecho en el rol > Copiar ID).
# Mientras role_id sea de ceros no mencionará a nadie útil; sin DISCORD_WEBHOOK_PINGS ni DEFAULT no se envía.

[[ping_rule]]
name = "jordan-4-barata"
keywords = ["jordan", "4"]
exclude_keywords = ["gs", "td", "ps"]
max_price = 230
channel = "pings"
role_id = "000000000000000000"
event_types = ["restock", "new_product", "price_drop", "price_error"]

[[ping_rule]]
name = "price-errors"
keywords = ["*"]              # cualquier producto
channel = "pings"
role_id = "000000000000000000"
event_types = ["price_error"]
