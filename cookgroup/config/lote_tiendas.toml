# Lote 1 de tiendas con canal propio (v1.1). Cada señal se activa SOLO si está probada con datos reales de la tienda.
#   probado     → test con una captura real de la tienda que pasa (la prueba se nombra en `prueba_*`)
#   por-probar  → la fuente lo permite, falta captura real que lo demuestre: el canal NO lo publica todavía
#   sin-fuente  → la tienda no lo ofrece por una vía pública/autorizada (p. ej. raffles de tiendas Shopify)
# Niveles de la tienda: descubierta (en inventario) → piloto (fuente validada y probada en local) → operativa (canal
# instalado en Discord y una entrega verificada). «operativa» la marca el panel a partir de las entregas, no este fichero.

intervalo_lote_s = 60   # lectura cada minuto (±10 %, escalonada); si una tienda pide esperar (429/Retry-After) se respeta

[[tienda]]
nombre = "BSTN"
canal = "bstn"
pais = "DE"
web = "https://www.bstn.com/eu_es/"
envio_es = "sí"
raffle_es = "sí (escaparate eu_es)"
monitores = ["bstn-eu"]
raffle = "probado"
lanzamiento = "probado"
restock = "probado"
rebaja = "probado"
prueba_raffle = "test_bstn::test_announced_date_changed_raffle_open_and_no_duplicates · test_bstn_e2e"
prueba_lanzamiento = "test_bstn::test_parse_real_listing"
prueba_restock = "test_bstn::test_live_then_size_restock_then_real_restock_later"
prueba_rebaja = "test_bstn::test_price_drop_from_product_page"

