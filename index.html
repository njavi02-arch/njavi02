<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BULLET OPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #0a0e27;
            font-family: 'Arial', sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #gameHUD {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            font-family: monospace;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        #mainMenu {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-hidden {
            display: none !important;
        }

        .menu-content {
            text-align: center;
        }

        .menu-title {
            font-size: 4rem;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            margin-bottom: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .menu-button {
            padding: 1rem 2rem;
            margin: 0.5rem;
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: 2px solid #00ff00;
            color: #000;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            transition: all 0.3s;
        }

        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
        }

        #ammoDisplay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: #00ff00;
        }

        #healthDisplay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 1.2rem;
            color: #00ff00;
        }

        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: #00ff00;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid rgba(0, 255, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        #crosshairDot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 0, 0.7);
            border-radius: 50%;
        }

        #killFeed {
            position: absolute;
            top: 80px;
            right: 20px;
            font-size: 0.9rem;
            color: #ff0000;
            max-height: 300px;
            overflow: hidden;
        }

        .kill-item {
            margin-bottom: 5px;
            opacity: 1;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="mainMenu">
        <div class="menu-content">
            <div class="menu-title">BULLET OPS</div>
            <button class="menu-button" id="playButton">PLAY</button>
            <button class="menu-button" id="settingsButton">SETTINGS</button>
            <button class="menu-button" id="quitButton">QUIT</button>
        </div>
    </div>

    <div id="gameHUD" class="menu-hidden">
        <div id="crosshair">
            <div id="crosshairDot"></div>
        </div>
        <div id="scoreDisplay">BLUE 0 - RED 0 | TIME 10:00</div>
        <div id="healthDisplay">
            <div>HP: <span id="healthValue">100</span>/100</div>
            <div id="weaponName">BO-01 ASSAULT RIFLE</div>
        </div>
        <div id="ammoDisplay">
            <div><span id="ammoMag">30</span> / <span id="ammoReserve">120</span></div>
        </div>
        <div id="killFeed"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.0.0/babylon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.0.0/babylon.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
    <script type="module">
        // BULLET OPS - FPS Prototype
        // Core game initialization and main loop

        import GameManager from './src/core/GameManager.js';
        import InputManager from './src/core/InputManager.js';

        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { antialias: true, preferWebGL2: true });

        let gameManager = null;
        let inputManager = null;

        async function initGame() {
            // Initialize game systems
            gameManager = new GameManager(engine);
            inputManager = new InputManager();

            // Initialize game world
            await gameManager.initialize();

            // Render loop
            engine.runRenderLoop(() => {
                gameManager.update();
                gameManager.scene.render();
            });

            // Resize handling
            window.addEventListener('resize', () => {
                engine.resize();
            });
        }

        // Start menu
        document.getElementById('playButton').addEventListener('click', async () => {
            document.getElementById('mainMenu').classList.add('menu-hidden');
            document.getElementById('gameHUD').classList.remove('menu-hidden');
            await initGame();
        });

        document.getElementById('settingsButton').addEventListener('click', () => {
            alert('Settings coming soon!');
        });

        document.getElementById('quitButton').addEventListener('click', () => {
            alert('Thanks for playing BULLET OPS!');
        });
    </script>
</body>
</html>
